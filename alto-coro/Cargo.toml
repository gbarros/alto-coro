[package]
name = "alto-coro"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
description = "Coro-backed Alto sequencer and replica for Celestia DA demos."

[[bin]]
name = "alto-coro"
path = "src/main.rs"

[dependencies]
alto-types = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
celestia-client = { workspace = true }
celestia-grpc = { workspace = true }
clap = { workspace = true, features = ["derive"] }
coro = { workspace = true }
coro-demo = { workspace = true }
commonware-codec = { workspace = true }
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-formatting = { workspace = true }
commonware-runtime = { workspace = true }
commonware-utils = { workspace = true }
rand = { workspace = true }
serde = { version = "1.0.218", features = ["derive"] }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
